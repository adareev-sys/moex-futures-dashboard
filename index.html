<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фьючерсы МосБиржи — календарный спред</title>
<style>
  :root { font-family: var(--kimi-font-sans, -apple-system, "Segoe UI", Roboto, sans-serif); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #1a1a1a; }
  button, input { font: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px; font-family: var(--kimi-font-sans, -apple-system, "Segoe UI", Roboto, sans-serif); }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .head h1 { font-size: 19px; font-weight: 600; margin: 0; }
  .meta { font-size: 12px; color: #777; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
  .tab { border: 1px solid #ddd; background: #fff; color: #444; border-radius: 6px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .tab[aria-pressed="true"] { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
  .params { font-size: 12px; color: #777; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; font-size: 12px; color: #777; padding: 6px 8px; border-bottom: 1px solid #ddd; white-space: nowrap; }
  td { padding: 7px 8px; border-bottom: 1px solid #eee; white-space: nowrap; }
  th.r, td.r { text-align: right; }
  th.c, td.c { text-align: center; }
  tr.row-open { background: #e7f6ec; }
  tr.row-close { background: #fdeceb; }
  .reg { font-size: 11px; padding: 1px 7px; border-radius: 5px; background: #f0f0f0; }
  .reg-vola { background: #fff3e0; }
  .watchbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; padding: 9px 12px; border: 1px dashed #ddd; border-radius: 10px; font-size: 12px; color: #555; flex-wrap: wrap; }
  .pos { border: 1px solid #ddd; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .pos .t { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .pos .d { font-size: 12px; color: #777; }
  .pnl { font-size: 15px; font-weight: 600; }
  .pnl.plus, .td-plus { color: #1a9e4b; }
  .pnl.minus, .td-minus { color: #d64541; }
  .legend { font-size: 12px; color: #777; margin-top: 10px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin: 0 4px 0 14px; vertical-align: baseline; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 14px; }
  .kpi { border: 1px solid #ddd; border-radius: 10px; padding: 9px 11px; }
  .kpi .l { font-size: 12px; color: #777; margin-bottom: 2px; }
  .kpi .v { font-size: 17px; font-weight: 600; }
  .chartbox { border: 1px solid #ddd; border-radius: 10px; padding: 10px 12px 4px; margin-bottom: 14px; }
  .chartbox .t { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .tblwrap { overflow-x: auto; }
  @media (max-width: 720px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .wrap { padding: 10px; }
    td, th { padding: 6px 5px; }
  }

  /* ---- тёмная тема (чёрный фон) ---- */
  html, body { background: #0b0b0d; } body { color: #e9e9ec; }
  .head h1 { color:#e9e9ec; }
  .wrap { background: #0b0b0d; color: #e9e9ec; min-height: 100vh; }
  .meta, .params, .legend, .pos .d { color: #8b8b92; }
  .head h1 { color: #e9e9ec; }
  .scheme { color: #8b8b92; }
  .tab { border-color: #33333a; color: #b9b9c0; background: transparent; }
  .tab[aria-pressed="true"] { background: #e9e9ec; color: #111; border-color: #e9e9ec; }
  h2 { color: #e9e9ec; }
  th { color: #8b8b92; border-bottom-color: #33333a; }
  td { border-bottom-color: #232329; }
  tr.row-open { background: rgba(64, 190, 110, 0.16); }
  tr.row-close { background: rgba(224, 82, 74, 0.16); }
  .reg { background: #2a2a31; color: #cfcfd6; }
  .reg-vola { background: #4a3419; color: #f0b35c; }
  .watchbar { border-color: #33333a; color: #b9b9c0; }
  .pos { border-color: #33333a; }
  .pos .t { color: #e9e9ec; }
  .kpi { border-color: #33333a; }
  .kpi .l { color: #8b8b92; }
  .kpi .v { color: #e9e9ec; }
  .chartbox { border-color: #33333a; }
  .chartbox .t { color: #e9e9ec; }
  .kimi-input, input[type="number"] { background: #17171b; border: 1px solid #33333a; color: #e9e9ec; }
  .pnl.plus, .td-plus { color: #4cc274; }
  .pnl.minus, .td-minus { color: #e0524a; }

  #capital { background: #17171b; border: 1px solid #33333a; color: #e9e9ec; }
  .tab { background: transparent; }
  #cret { color: #e9e9ec !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="meta" id="upd">загрузка…</span>
  </div>
  <div class="tabs" id="tabs"></div>

  <div id="mainview">
    <h2>Пары соседних контрактов</h2>
    <div class="tblwrap"><table>
      <thead><tr>
        <th>Пара</th><th class="r">Цена</th><th class="r">Объём</th>
        <th class="r">Спред</th><th class="r">Вход</th><th class="r">Выход</th>
        <th class="c">Режим</th><th class="c" title="Отслеживается — уведомления в Telegram">Следить</th>
      </tr></thead>
      <tbody id="pairs"></tbody>
    </table></div>
    <div class="watchbar">
      <span id="wltext"></span>
      <span class="meta">фильтр Telegram: watchlist.json в репозитории</span>
    </div>
    <div id="positions"></div>
  </div>

  <div id="reportview" style="display:none">
    <h2>Отчёт по прибыли</h2>
    <div class="tabs" id="rfilters" style="margin-bottom:14px"></div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:#777">
      <label for="capital">Капитал, ₽:</label>
      <input id="capital" type="number" min="10000" step="50000" value="1000000"
             style="padding:5px 8px;border:1px solid #ddd;border-radius:8px;width:140px;font-size:13px">
      <span id="cret" class="num" style="color:#1a1a1a;font-weight:600"></span>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="chartbox">
      <div class="t">Накопительная прибыль по закрытым сделкам, ₽</div>
      <svg id="equity" width="100%" height="170" viewBox="0 0 600 170" preserveAspectRatio="none"></svg>
    </div>
    <div class="tblwrap"><table>
      <thead><tr>
        <th>Пара</th><th>Вход</th><th>Выход</th><th class="r">Спред</th>
        <th class="r">Часов</th><th class="r">P&amp;L, ₽</th><th>Статус</th>
      </tr></thead>
      <tbody id="trades"></tbody>
    </table></div>
  </div>
</div>
<script>
let DATA = null;
let cur = null;
let repFilter = 'all';

const DEC = {BR:2, NG:3, Si:0, MX:0, GD:1, CR:3};

function px(gk, n){ return n==null?'—':Number(n).toLocaleString('ru-RU',{minimumFractionDigits:DEC[gk]??2, maximumFractionDigits:DEC[gk]??2}); }
function vol(n){ return n==null?'—':Number(n).toLocaleString('ru-RU'); }
function sp(n){ return n==null?'—':Number(n).toFixed(2); }
function rub(n){ n=Math.round(n); return (n>=0?'+':'−')+Math.abs(n).toLocaleString('ru-RU'); }
function dt(ms){ return ms?new Date(ms).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'; }

const localWatch = new Set(JSON.parse(localStorage.getItem('moex_watch') || '[]'));
function wlbar(){
  document.getElementById('wltext').textContent = localWatch.size
    ? `Следить: выбрано ${localWatch.size} пар (локально)`
    : 'Следить: нет — по умолчанию все пары';
}

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  DATA.groups.forEach(g=>{
    const b = document.createElement('button');
    b.className='tab'; b.textContent=g.title; b.setAttribute('aria-pressed', g.key===cur?'true':'false');
    b.onclick=()=>{cur=g.key; render();};
    el.appendChild(b);
  });
  const r = document.createElement('button');
  r.className='tab'; r.textContent='Отчёт'; r.setAttribute('aria-pressed', cur==='_rep'?'true':'false');
  r.onclick=()=>{cur='_rep'; render();};
  el.appendChild(r);
}

function render(){
  renderTabs();
  document.getElementById('upd').textContent = 'обновлено ' + DATA.updatedAt + ' · курс ' + DATA.fx;
  const isRep = cur==='_rep';
  document.getElementById('mainview').style.display = isRep?'none':'';
  document.getElementById('reportview').style.display = isRep?'':'none';
  if(isRep){ renderReport(); return; }

  const g = DATA.groups.find(x=>x.key===cur);
  const fut = {}; g.futures.forEach(f=>fut[f.symbol]=f);

  const pb = document.getElementById('pairs'); pb.innerHTML='';
  g.pairs.forEach(p=>{
    const fa=fut[p.a], fb=fut[p.b];
    const tr = document.createElement('tr');
    if(p.spread!=null && p.open!=null && p.spread>=p.open) tr.className='row-open';
    else if(p.spread!=null && p.close!=null && p.spread<=p.close) tr.className='row-close';
    tr.innerHTML = `
      <td>${p.pair}</td>
      <td class="r num">${px(g.key,fa?.close)} / ${px(g.key,fb?.close)}</td>
      <td class="r num">${vol(fa?.volume)} / ${vol(fb?.volume)}</td>
      <td class="r num">${sp(p.spread)}</td>
      <td class="r num">${p.open==null?'—':p.open.toFixed(2)}</td>
      <td class="r num">${p.close==null?'—':p.close.toFixed(2)}</td>
      <td class="c"><span class="reg ${p.regime==='ВОЛ'?'reg-vola':''}">${p.regime}</span></td>
      <td class="c"><input type="checkbox" style="width:15px;height:15px;accent-color:#1a1a1a;cursor:pointer" data-key="${g.key}:${p.a}|${p.b}" ${localWatch.has(g.key+':'+p.a+'|'+p.b)?'checked':''}></td>`;
    pb.appendChild(tr);
  });
  pb.querySelectorAll('input').forEach(cb=>{
    cb.onchange=()=>{ cb.checked?localWatch.add(cb.dataset.key):localWatch.delete(cb.dataset.key);
      localStorage.setItem('moex_watch', JSON.stringify([...localWatch])); wlbar(); };
  });
  wlbar();

  const box = document.getElementById('positions');
  const open = DATA.positions.open.filter(o=>o.group===g.key);
  box.innerHTML = '';
  if(!open.length){ box.innerHTML = '<div class="meta">нет открытых позиций</div>'; }
  open.forEach(o=>{
    const d = document.createElement('div');
    d.className='pos';
    d.innerHTML = `<div class="t">${o.pair} <span class="meta">· режим ${o.regime} · ${o.direction>0?'шорт дальний / лонг ближний':'лонг дальний / шорт ближний'}</span></div>
      <div class="d">вход ${dt(o.entryTs)} · спред ${Number(o.entrySpread).toLocaleString('ru-RU',{maximumFractionDigits:DEC[g.key]??2})} → сейчас ${Number(o.curSpread).toLocaleString('ru-RU',{maximumFractionDigits:DEC[g.key]??2})} · в позиции ${o.bars} ч из ${o.lim}</div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:4px">
        <span class="d">цены входа ${o.entryPx}</span>
        <span class="pnl ${o.floatRub>=0?'plus':'minus'} num">${rub(o.floatRub)} ₽</span>
      </div>`;
    box.appendChild(d);
  });
}

function baseDate(){
  const m = DATA.updatedAt.match(/(\d{2})\.(\d{2})\.(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : new Date();
}
function inPeriod(entryTs, f){
  if(f==='all') return true;
  const d = new Date(entryTs), b = baseDate();
  if(f==='day')   return d.toDateString()===b.toDateString();
  if(f==='week')  return d >= new Date(b.getTime()-6*864e5);
  if(f==='month') return d.getFullYear()===b.getFullYear() && d.getMonth()===b.getMonth();
  return true;
}

function renderReport(){
  const chips = [['day','День'],['week','Неделя'],['month','Месяц'],['all','Все']];
  const fb = document.getElementById('rfilters'); fb.innerHTML='';
  chips.forEach(([k,l])=>{
    const b=document.createElement('button');
    b.className='tab'; b.textContent=l; b.setAttribute('aria-pressed', repFilter===k?'true':'false');
    b.onclick=()=>{repFilter=k; renderReport();};
    fb.appendChild(b);
  });

  const closed = DATA.positions.closed.filter(t=>inPeriod(t.entryTs, repFilter));
  const openAll = DATA.positions.open;
  const net = closed.reduce((s,t)=>s+t.pnlRub,0);
  const win = closed.length ? closed.filter(t=>t.pnlRub>0).length/closed.length : 0;
  const floatPnl = openAll.reduce((s,t)=>s+(t.floatRub||0),0);
  let cum=0, peak=0, dd=0;
  const curve = [0, ...closed.map(t=>{cum+=t.pnlRub; peak=Math.max(peak,cum); dd=Math.min(dd,cum-peak); return cum;})];
  const dates = closed.length ? [closed[0].entryTs, closed[closed.length-1].exitTs] : null;
  const capEl = document.getElementById('capital');
  const cap = Math.max(1, parseFloat(capEl.value) || 1000000);
  capEl.oninput = () => renderReport();
  // капитал на начало выбранного периода = ввод + результат всех сделок до его начала
  const b0 = baseDate();
  const startTs = repFilter==='day' ? new Date(b0.getFullYear(), b0.getMonth(), b0.getDate()).getTime()
                : repFilter==='week' ? b0.getTime() - 6*864e5
                : repFilter==='month' ? new Date(b0.getFullYear(), b0.getMonth(), 1).getTime()
                : null;
  const priorNet = (DATA.positions.closed||[]).reduce((s,t)=>s+((startTs==null || t.entryTs<startTs)?t.pnlRub:0),0);
  const capStart = cap + priorNet;
  const ret = net / capStart * 100;
  document.getElementById('cret').textContent = 'Доходность за период: ' + (ret>=0?'+':'') + ret.toFixed(2) +
    '% (база: ' + Math.round(capStart).toLocaleString('ru-RU') + ' ₽)';
  const kdata = [
    ['Закрыто сделок', closed.length],
    ['Рейтинг', Math.round(win*100)+'%'],
    ['Нетто, ₽', rub(net), net>=0?'plus':'minus'],
    ['Доходность', (ret>=0?'+':'')+ret.toFixed(2)+'%', ret>=0?'plus':'minus'],
    ['Плавающий, ₽', rub(floatPnl), floatPnl>=0?'plus':'minus'],
    ['Просадка, ₽', rub(dd), 'minus']
  ];
  const kb = document.getElementById('kpis'); kb.innerHTML='';
  kdata.forEach(([l,v,c])=>{
    const d=document.createElement('div'); d.className='kpi';
    d.innerHTML=`<div class="l">${l}</div><div class="v num ${c||''}">${v}</div>`;
    kb.appendChild(d);
  });

  drawEquity(curve, dates);

  const tb = document.getElementById('trades'); tb.innerHTML='';
  const row = t => {
    const tr=document.createElement('tr');
    if(t.open) tr.style.background='#f2faf4';
    const sDec = {BR:2,NG:3,Si:0,MX:0,GD:1,CR:3}[t.group] ?? 2;
    const fmtS = v => Number(v).toLocaleString('ru-RU',{maximumFractionDigits:sDec});
    tr.innerHTML=`<td>${t.pair}</td><td class="num">${dt(t.entryTs)}</td><td class="num">${t.open?'—':dt(t.exitTs)}</td>
      <td class="r num">${t.open?fmtS(t.entrySpread)+' → '+fmtS(t.curSpread):fmtS(t.entrySpread)+' → '+fmtS(t.exitSpread)}</td>
      <td class="r num">${t.bars}</td>
      <td class="r num ${t.pnlRub>=0?'td-plus':'td-minus'}">${rub(t.pnlRub)}</td>
      <td class="meta">${t.status}</td>`;
    tb.appendChild(tr);
  };
  openAll.forEach(o=>row({...o, open:true, pnlRub:o.floatRub,
    status:`открыта · ${o.bars} ч`}));
  [...closed].reverse().forEach(t=>row({...t, status:'закрыта · '+t.reason}));
}

function drawEquity(points, dates){
  const svg = document.getElementById('equity');
  const W=600, H=170, P={l:56,r:14,t:14,b:24};
  let mn=Math.min(0,...points), mx=Math.max(0,...points);
  if(mx===mn){mx=mn+1;}
  const x=i=>P.l+(W-P.l-P.r)*(points.length===1?0.5:i/(points.length-1));
  const y=v=>P.t+(H-P.t-P.b)*(1-(v-mn)/(mx-mn));
  const line = points.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const zero = y(0).toFixed(1);
  const step = Math.max(1, Math.ceil((mx-mn)/4));
  let grid='';
  for(let v=Math.ceil(mn/step)*step; v<=mx; v+=step){
    grid+=`<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" stroke="#232329" stroke-width="0.6"/>
           <text x="${P.l-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-size="10" fill="#8b8b92" class="num">${v.toLocaleString('ru-RU')}</text>`;
  }
  const area = `${line} L${x(points.length-1).toFixed(1)},${zero} L${x(0).toFixed(1)},${zero} Z`;
  const dots = points.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.8" fill="#0b0b0d" stroke="#4d8dff" stroke-width="1.6"/>`).join('');
  const lastV = points[points.length-1];
  const lastLbl = `<text x="${(x(points.length-1)-4).toFixed(1)}" y="${(y(lastV)-8).toFixed(1)}" text-anchor="end" font-size="11" font-weight="600" fill="#e9e9ec" class="num">${lastV.toLocaleString('ru-RU')} ₽</text>`;
  const fmtD = ms => { const d=new Date(ms); return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`; };
  const xLbl = dates ? `<text x="${P.l}" y="${H-6}" font-size="10" fill="#8b8b92" class="num">${fmtD(dates[0])}</text>
     <text x="${W-P.r}" y="${H-6}" text-anchor="end" font-size="10" fill="#8b8b92" class="num">${fmtD(dates[1])}</text>` : '';
  svg.innerHTML = `
    <defs><clipPath id="clip"><rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}"/></clipPath></defs>
    ${grid}
    <line x1="${P.l}" y1="${zero}" x2="${W-P.r}" y2="${zero}" stroke="#55555e" stroke-width="1"/>
    <path d="${area}" fill="#4d8dff" opacity="0.18" clip-path="url(#clip)"/>
    <path d="${line}" fill="none" stroke="#4d8dff" stroke-width="1.8" clip-path="url(#clip)"/>
    <g clip-path="url(#clip)">${dots}</g>
    ${lastLbl}${xLbl}`;
}

fetch('data.json').then(r=>r.json()).then(d=>{
  DATA = d;
  if(!DATA.positions) DATA.positions = {open:[],closed:[]};
  cur = DATA.groups[0].key;
  render();
}).catch(e=>{
  document.getElementById('upd').textContent = 'ошибка загрузки data.json: '+e;
});
</script>
</body>
</html>
